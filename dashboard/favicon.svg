<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="prism-grad" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#1d4ed8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="beam-red" x1="22" y1="36" x2="58" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="beam-yellow" x1="22" y1="36" x2="60" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="beam-cyan" x1="22" y1="36" x2="58" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Glass Prism Body -->
  <polygon points="32,10 54,50 10,50" fill="url(#prism-grad)" stroke="#93c5fd" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="32,10 40,50 10,50" fill="#3b82f6" fill-opacity="0.25"/>
  <!-- Incoming White Light Beam -->
  <line x1="4" y1="38" x2="22" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Refracted Spectral Rays -->
  <line x1="22" y1="36" x2="58" y2="24" stroke="url(#beam-red)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="36" x2="60" y2="34" stroke="url(#beam-yellow)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="36" x2="58" y2="44" stroke="url(#beam-cyan)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
